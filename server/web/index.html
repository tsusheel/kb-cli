<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Sleek Minimal Header -->
    <header class="app-header">
      <div class="search-container">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search (/ to focus)" 
            autocomplete="off" 
            spellcheck="false"
            autofocus
          >
          <button id="clear-search-btn" class="btn-clear" title="Clear (Esc)" style="display: none;">✕</button>
          <span class="search-count-badge" id="search-count">0</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="new-note-btn" class="btn btn-primary" title="New Note (N)">+ New</button>
        <button id="sync-btn" class="btn btn-secondary" title="Sync Database">Sync</button>
      </div>
    </header>

    <!-- Minimal Filter Bar -->
    <nav class="filter-bar">
      <div class="filter-pills" id="type-filter-pills">
        <button class="pill active" data-filter="all">All <span class="pill-count" id="count-all">0</span></button>
        <button class="pill" data-filter="note">Notes <span class="pill-count" id="count-note">0</span></button>
        <button class="pill" data-filter="todo">Todos <span class="pill-count" id="count-todo">0</span></button>
        <button class="pill" data-filter="project">Projects <span class="pill-count" id="count-project">0</span></button>
        <button class="pill" data-filter="idea">Ideas <span class="pill-count" id="count-idea">0</span></button>
        <button class="pill" data-filter="log">Logs <span class="pill-count" id="count-log">0</span></button>
        <button class="pill pill-archive" data-filter="archived">Archive <span class="pill-count" id="count-archived">0</span></button>
      </div>

      <div class="tag-filter-container">
        <div class="tag-scroll-area" id="tag-pills"></div>
      </div>
    </nav>

    <!-- Main Dual-Pane View -->
    <main class="main-split-container">
      <!-- Left: Fuzzy Results List -->
      <section class="results-pane" id="results-pane">
        <div class="results-list" id="results-list" tabindex="0">
          <div class="loading-state">Loading...</div>
        </div>
      </section>

      <!-- Right: Live Preview -->
      <section class="preview-pane" id="preview-pane">
        <div id="preview-empty" class="preview-empty-state">
          <div class="empty-title">Select a note to preview</div>
        </div>

        <div id="preview-content" class="preview-content" style="display: none;">
          <!-- Preview Header -->
          <div class="preview-header">
            <div class="preview-title-row">
              <h1 id="preview-title" class="preview-title"></h1>
              <div class="preview-actions">
                <button id="copy-id-btn" class="btn btn-sm btn-secondary" title="Copy ID (C)">
                  <span id="preview-short-id"></span>
                </button>
                <button id="toggle-status-btn" class="btn btn-sm btn-secondary" title="Toggle Status (T)">Done</button>
                <button id="edit-note-btn" class="btn btn-sm btn-secondary" title="Edit Note (E)">Edit</button>
                <button id="delete-note-btn" class="btn btn-sm btn-secondary" title="Delete Note">Delete</button>
              </div>
            </div>

            <!-- Metadata Row -->
            <div class="preview-meta-row">
              <span id="preview-type-badge" class="type-badge"></span>
              <span id="preview-status-badge" class="status-badge"></span>
              <span id="preview-area-badge" class="area-badge" style="display: none;"></span>
              <span id="preview-due-badge" class="due-badge" style="display: none;"></span>
              <span id="preview-updated-time" class="time-meta"></span>
            </div>

            <!-- Tags -->
            <div id="preview-tags-row" class="preview-tags-row"></div>
          </div>

          <!-- Markdown Content -->
          <div class="preview-body-container">
            <div id="preview-markdown-body" class="markdown-body"></div>
          </div>

          <!-- Graph Relations -->
          <div id="preview-graph-section" class="preview-graph-section" style="display: none;">
            <div class="graph-section-title">Relations & Backlinks</div>
            <div id="preview-links-list" class="links-list"></div>
          </div>

          <!-- Revision History -->
          <div id="preview-history-section" class="preview-history-section" style="display: none;">
            <div class="history-section-header">
              <span class="history-section-title">History</span>
              <button id="toggle-history-btn" class="btn-text">Hide</button>
            </div>
            <div id="preview-history-list" class="history-list"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer: Minimal Shortcuts Bar -->
    <footer class="app-footer">
      <div class="shortcut-hints">
        <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="hint-item"><kbd>/</kbd> Search</span>
        <span class="hint-item"><kbd>Esc</kbd> Clear</span>
        <span class="hint-item"><kbd>N</kbd> New</span>
        <span class="hint-item"><kbd>T</kbd> Toggle</span>
        <span class="hint-item"><kbd>C</kbd> Copy ID</span>
        <span class="hint-item"><kbd>M</kbd> Copy MD</span>
        <span class="hint-item"><kbd>E</kbd> Edit</span>
      </div>
      <div class="footer-stats" id="footer-stats"></div>
    </footer>

    <!-- Note Modal -->
    <div id="note-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">New Note</h2>
          <button id="modal-close-btn" class="btn-icon">✕</button>
        </div>
        <form id="note-form" class="modal-form">
          <input type="hidden" id="form-note-id" value="">
          
          <div class="form-group">
            <label for="form-title">Title</label>
            <input type="text" id="form-title" class="form-input" placeholder="Title..." required>
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label for="form-type">Type</label>
              <select id="form-type" class="form-select">
                <option value="note">Note</option>
                <option value="todo">Todo</option>
                <option value="project">Project</option>
                <option value="idea">Idea</option>
                <option value="decision">Decision</option>
                <option value="concept">Concept</option>
                <option value="til">TIL</option>
                <option value="resource">Resource</option>
              </select>
            </div>

            <div class="form-group form-col">
              <label for="form-status">Status</label>
              <select id="form-status" class="form-select">
                <option value="raw">Raw</option>
                <option value="active">Active</option>
                <option value="in-progress">In-Progress</option>
                <option value="refined">Refined</option>
                <option value="completed">Completed</option>
                <option value="archived">Archived</option>
              </select>
            </div>

            <div class="form-group form-col">
              <label for="form-area">Area</label>
              <input type="text" id="form-area" class="form-input" placeholder="work, personal...">
            </div>

            <div class="form-group form-col">
              <label for="form-due">Due Date</label>
              <input type="text" id="form-due" class="form-input" placeholder="e.g. today, 2026-09-30">
            </div>
          </div>

          <div class="form-group">
            <label for="form-tags">Tags</label>
            <input type="text" id="form-tags" class="form-input" placeholder="golang, backend...">
          </div>

          <div class="form-group">
            <label for="form-flesh">Content</label>
            <textarea id="form-flesh" class="form-textarea" rows="8" placeholder="Markdown body..."></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="modal-submit-btn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="display: none;"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
