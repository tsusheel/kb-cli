version: 2

project_name: kb

builds:
  - id: kb
    main: ./main.go
    binary: kb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: packages
    package_name: kb
    vendor: tsusheel
    homepage: https://github.com/tsusheel/kb-cli
    maintainer: "Sushil Thakur <tsusheel.135@gmail.com>"
    description: "Knowledge Base CLI"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

aurs:
  - name: kb-bin
    homepage: https://github.com/tsusheel/kb-cli
    description: "Knowledge Base CLI"
    maintainers:
      - "Sushil Thakur <tsusheel.135@gmail.com>"
    license: MIT
    private_key: "${{ secrets.AUR_SSH_PRIVATE_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/kb-bin.git"
    package: |-
      install -Dm755 "${srcdir}/kb" "${pkgdir}/usr/bin/kb"

brews:
  - name: kb
    repository:
      owner: tsusheel
      name: homebrew-tap
      token: "${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tsusheel/kb-cli
    description: "Knowledge Base CLI"
    license: MIT

scoops:
  - name: kb
    repository:
      owner: tsusheel
      name: scoop-bucket
      token: "${{ secrets.SCOOP_TAP_GITHUB_TOKEN }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
